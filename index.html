<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Student Performance Prediction</h1>

    <form method="POST">

        <label>Study Hours:</label>
        <input type="number" name="study_hours"
        min="0" max="24" step="any" required>

        <label>Attendance (%):</label>
        <input type="number" name="attendance"
        min="0" max="100" step="any" required>

        <label>Previous Marks:</label>
        <input type="number" name="previous_marks"
        min="0" max="100" step="any" required>

        <label>Sleep Hours:</label>
        <input type="number" name="sleep_hours"
        min="0" max="24" step="any" required>

        <label>Assignment Score:</label>
        <input type="number" name="assignment_score"
        min="0" max="100" step="any" required>

        <button type="submit">Predict Marks</button>

    </form>

    {% if prediction is not none %}
        <h2>Predicted Final Marks: {{ prediction }}</h2>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
